<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ - O SAMBA</title>

    <link rel="icon" href="./assets/icon/logo-removebg-preview.png">
    <link rel="stylesheet" href="./css/quiz.css">
</head>

<body onload="onloadEsconder()">
    <div id="pontuacaoEJogo">
        <button id="btnIniciarQuiz" onclick="iniciarQuiz()"> INICIAR QUIZ </button>

        <div id="jogo" class="width-fit-content flex-colunar border-secondary">
            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div id="infoQuestao" class="padding-8">
                <span>
                    Questão atual:
                    <span id="spanNumeroDaQuestaoAtual"></span>
                    de
                    <span id="qtdQuestoes"></span>
                    questões.
                </span>
            </div>

            <div id="perguntaDaQuestaoAtual" class="padding-8">
                <span id="spanQuestaoExibida" class="text-bold"></span>
            </div>

            <div id="infoAlternativas" class="padding-8">
                <span>
                    <em>Escolha uma opção dentre as abaixo:</em>
                </span>
            </div>

            <div id="opcoes" class="flex-colunar padding-8">
                <span>
                    <input type="radio" id="primeiraOpcao" name="option" class="radio"   value="A" />
                    <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
                </span>
                <span>
                    <input type="radio" id="segundaOpcao" name="option" class="radio"   value="B" />
                    <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
                </span>
                <span>
                    <input type="radio" id="terceiraOpcao" name="option" class="radio" value="C" />
                    <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
                </span>
            </div>

            <div id="botoes" class="flex-colunar padding-8">

                <button onclick="submeter()" id="btnSubmeter">
                    Submeter resposta
                </button>

                <button onclick="avancar()" id="btnProx" disabled>
                    Avançar para próxima questão
                </button>
            </div>
        </div>
    </div>
</body>

</html>
<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

   // variáveis globais
    let listaDeQuestoes = [];
    let numeroDaQuestaoAtual = 0;
    let quantidadeDeQuestoes = 0;

    // Carregar questão no banco
    fetch("/quiz/listar")

        .then(function (resposta) {

            return resposta.json();

        })

        .then(function (dados) {

            console.log("QUESTÕES DO BANCO:");
            console.log(dados);

            listaDeQuestoes = dados;

            quantidadeDeQuestoes = listaDeQuestoes.length;

            document.getElementById("qtdQuestoes").innerHTML = quantidadeDeQuestoes;
        })

        .catch(function (erro) {

            console.log("Erro ao buscar perguntas:");
            console.log(erro);

        });

    function onloadEsconder() {

        document.getElementById("jogo").style.display = "none";

    }

    // começar o quiz
    function iniciarQuiz() {

        if (listaDeQuestoes.length == 0) {

            alert("As perguntas ainda não carregaram.");

            return;

        }

        document.getElementById("jogo").style.display = "flex";

        document.getElementById("btnIniciarQuiz").style.display = "none";

        preencherHTMLcomQuestaoAtual(0);

        btnSubmeter.disabled = false;

        btnProx.disabled = true;

    }
    // mostrar a questão
    function preencherHTMLcomQuestaoAtual(index) {

        if (!listaDeQuestoes[index]) {

            console.log("Questão não encontrada");

            return;

        }

        habilitarAlternativas(true);

        const questaoAtual = listaDeQuestoes[index];

        numeroDaQuestaoAtual = index;

        console.log("Questão atual:");
        console.log(questaoAtual);

        document.getElementById("spanNumeroDaQuestaoAtual").innerHTML =
            index + 1;

        document.getElementById("spanQuestaoExibida").innerHTML =
            questaoAtual.pergunta;

        document.getElementById("labelOpcaoUm").innerHTML =
            questaoAtual.alternativaA;

        document.getElementById("labelOpcaoDois").innerHTML =
            questaoAtual.alternativaB;

        document.getElementById("labelOpcaoTres").innerHTML =
            questaoAtual.alternativaC;

    }
    // submeter a resposta
    function submeter() {

        const options = document.getElementsByName("option");

        let alternativaSelecionada = "";

        let hasChecked = false;


        for (let i = 0; i < options.length; i++) {
            if (options[i].checked) {

                hasChecked = true;

                alternativaSelecionada = options[i].value;

                break;

            }
        }
        if (!hasChecked) {

            alert("Escolha uma alternativa.");

            return;

        }

        const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual];

        // salvar no BD
        fetch("/quiz/responder", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                fkUsuario: sessionStorage.ID_USUARIO,

                fkPergunta: questaoAtual.idQuiz,

                respostaEscolhida: alternativaSelecionada

            })

        })

        .then(function (resposta) {

            console.log("Resposta salva!");

        })

        .catch(function (erro) {

            console.log("Erro ao salvar resposta");
            console.log(erro);

        });


        btnSubmeter.disabled = true;

        btnProx.disabled = false;

        habilitarAlternativas(false);

    }
    // habilitar/desabilitar a opção
    function habilitarAlternativas(trueOrFalse) {

        let desabilitar = trueOrFalse ? false : true;

        primeiraOpcao.disabled = desabilitar;

        segundaOpcao.disabled = desabilitar;

        terceiraOpcao.disabled = desabilitar;

    }

    // avançar a questão
    function avancar() {

        btnProx.disabled = true;

        btnSubmeter.disabled = false;

        desmarcarRadioButtons();


        if (numeroDaQuestaoAtual < quantidadeDeQuestoes - 1) {

            numeroDaQuestaoAtual++;

            preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual);

        } else {

            finalizarJogo();

        }

    }
    // desmar o radio
       function desmarcarRadioButtons() {
        const options = document.getElementsByName("option");
        for (let i = 0; i < options.length; i++) {
           options[i].checked = false;
        }
    }
    // finalizar o quiz
    function finalizarJogo() {

        alert("Quiz finalizado!");

        btnSubmeter.disabled = true;
        btnProx.disabled = true;

        window.location = "dashboard/dashboard.html";
    }
</script>
