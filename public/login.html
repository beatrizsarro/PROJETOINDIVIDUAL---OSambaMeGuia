<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O Samba Me Guia | Login</title>


    <script src="./js/sessao.js"></script>
    <link rel="icon" href="./assets/icon/logo-removebg-preview.png">

    <link
        href="https://fonts.googleapis.com/css2?family=Freckle+Face&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/estilo.css">
</head>
<!DOCTYPE html>
<html lang="en">

<body>
    <!-- inicio do header -->
    <header class="header">
        <div class="container">
            <a href="home.html" class="logo">
                <img src="assets/icon/logo-removebg-preview.png" alt="logo">
            </a>
            <nav class="navBar">
                <a href="index.html">Home</a>
                <a href="">O Samba</a>
                <a href="#">Login</a>
                <a href="cadastro.html">Cadastro</a>
            </nav>
        </div>
    </header>
    <!-- fim do header -->

    <!-- container de login -->
    <div class="login">
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card card-login">
                <h1 class="titulo"> LOGIN </h1>
                <div class="formulario">
                    <div class="campo">
                        <span> E-mail: </span>
                        <input id="email_input" type="text" placeholder="Login">
                    </div> <br>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>
                </div>
                <p>
                    Ainda não possui uma conta? <br>
                    <a href="" id="link_cad">Cadastrar-se</a>
                </p>
                <button class="botao" onclick="entrar()">Entrar</button>
                <div id="div_erros_login"></div>
            </div>
        </div>

    </div>

    <!--inicio do footer -->
    <footer class="footer">
        <div class="subtitulo">
            <h2>Feito por Beatriz Sarro </h2>
            <img src="assets/imgs/pandeiro.png" alt="pandeiroLogo">
        </div>
        <!-- fim do footer-->
    </footer>
</body>

</html>
<script>

    function entrar() {
        // aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>

</html>
