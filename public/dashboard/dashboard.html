<body onload=" obterDadosGrafico()">

            <div class="btn-nav-white">

            <div class="btns-dash" id="btnAquario">
                <!-- O gráfico é chamado de acordo com o id (fk_aquario) do banco  -->
            </div>

            <div id="kpiInstrumento" class="kpi-card"></div>

            <div id="barra" class="grafico">

    </div>

<script>
    b_usuario.innerHTML = sessionStorage.NOME_USUARIO;

    let proximaAtualizacao;

    // O gráfico é construído com três funções:
    // 1. obterDadosGrafico -> Traz dados do Banco de Dados para montar o gráfico da primeira vez
    // 2. plotarGrafico -> Monta o gráfico com os dados trazidos e exibe em tela
    // 3. atualizarGrafico -> Atualiza o gráfico, trazendo novamente dados do Banco

    // Esta função *obterDadosGrafico* busca os últimos dados inseridos em tabela de medidas.
    // para, quando carregar o gráfico da primeira vez, já trazer com vários dados.
    // A função *obterDadosGrafico* também invoca a função *plotarGrafico*

    //     Se quiser alterar a busca, ajuste as regras de negócio em src/controllers
    //     Para ajustar o "select", ajuste o comando sql em src/models
    function obterDadosGrafico() {
        fetch(`/dashboard/${sessionStorage.ID_USUARIO}`)
            .then(function (response) {
                return response.json();
            })
            .then(function (dados) {
                console.log("Dados recebidos:", dados);
                if (dados && dados.length > 0) {
                    plotarGraficoBarra(dados);
                    exibirKPI(dados);
                } else {
                    console.error("Nenhum dado recebido para o gráfico");
                }
            })
            .catch(function (erro) {
                console.log(erro);
            })
    }

    function plotarGraficoBarra(dados) {
        var ctx = document.getElementById('bar').getContext('2d');
        
        var myChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: [' Quantidade de Instrumentos Escolhidos'],
                datasets: [
                    {
                        label: dados[2].Nome_Instrumento, // Cavaquinho
                        data: [dados[2].qtd_Usuario],
                        backgroundColor: 'rgba(117, 8, 14, 0.5)',
                        borderColor: 'rgba(117, 8, 14, 1)',
                        borderWidth: 1
                    },
                    {
                        label: dados[0].Nome_Instrumento, // Pandeiro
                        data: [dados[0].qtd_Usuario],
                        backgroundColor: 'rgba(253, 205, 45, 0.5)',
                        borderColor: 'rgba(253, 205, 45, 1)',
                        borderWidth: 1
                    },
                    {
                        label: dados[1].Nome_Instrumento, // Tamborim
                        data: [dados[1].qtd_Usuario],
                        backgroundColor: 'rgba(0, 0, 102, 0.5)',
                        borderColor: 'rgba(0, 0, 102, 1)',
                        borderWidth: 1
                    }
                ]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    }

    function atualizarGrafico(idUsuario, myChart) {
        fetch(`/dashboard/${idUsuario}`, { cache: 'no-store' })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error("Erro ao buscar dados");
                }
            })
            .then(novosDados => {
                console.log("Novos dados recebidos:", novosDados);

                // Atualiza os valores do dataset
                myChart.data.datasets[0].data = [
                    novosDados[2].Cavaquinho,
                    novosDados[0].Pandeiro,
                    novosDados[1].Tamborim
                ];

                // Atualiza o gráfico
                myChart.update();

                // Agenda próxima atualização
                setTimeout(() => atualizarGrafico(idUsuario, myChart), 5000);
            })
            .catch(error => {
                console.error("Erro na atualização do gráfico:", error);
                setTimeout(() => atualizarGrafico(idUsuario, myChart), 5000);
            });
    }

 function exibirKPI(dados) {
    var instrumentoUsuario = dados[0].Nome_InstrumentoUsuario; 
    var qtdInstrumentoUsuario = 0;

    for (var i = 0; i < dados.length; i++) {
        if (dados[i].Nome_Instrumento == instrumentoUsuario) {
            qtdInstrumentoUsuario = dados[i].qtd_Usuario;
            break;
        }
    }

    var kpiDiv = document.getElementById("kpiInstrumento");
    kpiDiv.innerHTML = `
        <h3>Seu instrumento: ${instrumentoUsuario}</h3>
        <p>Quantidade de pessoas que tiveram o mesmo instrumento: <br><strong>${qtdInstrumentoUsuario}</strong></p>
    `;
}
</script>
